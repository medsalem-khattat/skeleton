workflows:
  android-release:
    name: Android release
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      groups:
        - app_secrets
      android_signing:
        - medsalem
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Analyze Dart code
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build Android App Bundle
        script: |
          flutter build appbundle \
            --release \
            --build-name=1.0.0 \
            --build-number="$BUILD_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=API_KEY="$API_KEY"
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
    publishing:
      email:
        recipients:
          - $CM_PUBLISH_EMAIL
        notify:
          success: true
          failure: true

  ios-release:
    name: iOS release
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: codemagic
    environment:
      flutter: stable
      groups:
        - app_secrets
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yourname.skeleton
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Analyze Dart code
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Apply iOS signing profiles
        script: xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          flutter build ipa \
            --release \
            --build-name=1.0.0 \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=API_KEY="$API_KEY"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - $CM_PUBLISH_EMAIL
        notify:
          success: true
          failure: true
