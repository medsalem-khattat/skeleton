# One file for every deployment. Each customer runs these workflows in the
# customer's own Codemagic team, where the customer's secrets live; the
# repository holds no secrets. The deployment is selected by DEPLOYMENT_ID
# (deployments/<id>/deployment.json). See docs/DEPLOYMENT.md.
#
# Environment groups expected in the customer's Codemagic team:
#   deployment       DEPLOYMENT_ID, CM_PUBLISH_EMAIL, optional API_KEY;
#                    for a customer also DEPLOYMENT_REPO (SSH URL of the
#                    customer's deployment repository) and
#                    DEPLOYMENT_REPO_SSH_KEY (secure, its read-only deploy key)
#   firebase_deploy  FIREBASE_SERVICE_ACCOUNT (secure)
#   ios_signing      APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER,
#                    APP_STORE_CONNECT_PRIVATE_KEY, CERTIFICATE_PRIVATE_KEY (all secure)
#   google_play      GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (secure)
# Code signing identity: the Android upload keystore with reference name
# upload_keystore.
#
# The release workflows build a customer deployment only from the release tag
# of the version in frontend/pubspec.yaml (start the build on tag vX.Y.Z).
# Deployments marked "internal" may build from any commit.
# See docs/RELEASE_AND_SUPPORT.md.

definitions:
  scripts:
    - &fetch_deployment
      name: Fetch deployment
      script: node tool/deployment.mjs fetch "$DEPLOYMENT_ID"
    - &release_check
      name: Check release tag
      script: node tool/deployment.mjs release-check "$DEPLOYMENT_ID"
    - &use_deployment
      name: Select deployment
      script: node tool/deployment.mjs use "$DEPLOYMENT_ID"
    - &backend_install
      name: Install backend dependencies
      script: cd backend/functions && npm ci
    - &backend_build
      name: Build Cloud Functions
      script: cd backend/functions && npm run build
    - &backend_test_functions
      name: Test Cloud Functions logic
      script: cd backend/functions && npm test
    - &backend_test_rules
      name: Test Firestore and Storage rules
      script: cd backend/functions && npm run test:rules
    - &frontend_install
      name: Install dependencies
      script: cd frontend && flutter pub get
    - &frontend_analyze
      name: Analyze Dart code
      script: cd frontend && flutter analyze
    - &frontend_test
      name: Run tests
      script: cd frontend && flutter test
  email: &email
    email:
      recipients:
        - $CM_PUBLISH_EMAIL
      notify:
        success: true
        failure: true

workflows:
  # Runs in our team on every change. Uses the committed example deployment
  # (placeholder Firebase values), so it needs no customer data or secrets.
  frontend-ci:
    name: Frontend CI
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      flutter: stable
      node: 22
      vars:
        DEPLOYMENT_ID: example
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - 'frontend/'
          - 'deployments/'
          - 'tool/'
    scripts:
      - name: Check every deployment
        script: |
          set -euo pipefail
          for dir in deployments/*/; do
            node tool/deployment.mjs check "$(basename "$dir")"
          done
      - *use_deployment
      - *frontend_install
      - *frontend_analyze
      - *frontend_test

  backend-ci:
    name: Backend CI
    instance_type: linux_x2
    max_build_duration: 20
    environment:
      node: 22
      java: 21
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - 'backend/'
    scripts:
      - *backend_install
      - *backend_build
      - *backend_test_functions
      - *backend_test_rules

  # Started manually in the customer's team before the first deployment
  # (docs/CUSTOMER_PREREQUISITES.md §4). Proves that every secret the customer
  # pasted works, without anyone reading it; changes nothing.
  readiness-check:
    name: Readiness check
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      node: 22
      groups:
        - deployment
        - firebase_deploy
        - ios_signing
        - google_play
      android_signing:
        - upload_keystore
    scripts:
      - *fetch_deployment
      - name: Check deployment and deploy credential
        script: node tool/deployment.mjs check "$DEPLOYMENT_ID"
      - *use_deployment
      - *backend_install
      - name: Check customer accounts and secrets
        script: |
          set -uo pipefail
          failures=0
          pass() { echo "OK    $1"; }
          fail() { echo "FAIL  $1"; failures=$((failures + 1)); }
          warn() { echo "WAIT  $1"; }

          [ -n "${CM_PUBLISH_EMAIL:-}" ] && pass "CM_PUBLISH_EMAIL is set" \
            || fail "CM_PUBLISH_EMAIL is missing from group deployment"

          credentials_path="$HOME/firebase-deploy-sa.json"
          printf '%s' "${FIREBASE_SERVICE_ACCOUNT:-}" > "$credentials_path"
          chmod 600 "$credentials_path"
          if output=$(cd backend/functions && GOOGLE_APPLICATION_CREDENTIALS="$credentials_path" \
              npx firebase apps:list --project "$FIREBASE_PROJECT_ID" 2>&1); then
            pass "Firebase deploy key can access $FIREBASE_PROJECT_ID"
          else
            fail "Firebase deploy key cannot access $FIREBASE_PROJECT_ID (guide 2, Part 2B Step 7)"
            printf '%s\n' "$output" | tail -5
          fi
          rm -f "$credentials_path"

          if output=$(app-store-connect apps list 2>&1); then
            if printf '%s\n' "$output" | grep -Fq "$APP_ID"; then
              pass "App Store Connect key works and the app $APP_ID exists"
            else
              fail "App Store Connect key works, but there is no app for $APP_ID (guide 3, Part 2B Step 2)"
            fi
          else
            fail "App Store Connect key does not work (guide 3, Part 2B Step 4)"
            printf '%s\n' "$output" | tail -5
          fi

          printf '%s\n' "${CERTIFICATE_PRIVATE_KEY:-}" | openssl rsa -check -noout >/dev/null 2>&1 \
            && pass "CERTIFICATE_PRIVATE_KEY is an RSA private key" \
            || fail "CERTIFICATE_PRIVATE_KEY is missing or not an RSA private key (guide 3, Part 2B Step 5)"

          if play_email=$(node -e 'const c = JSON.parse(process.env.GCLOUD_SERVICE_ACCOUNT_CREDENTIALS || "{}");
              if (c.type !== "service_account" || !c.client_email) process.exit(1);
              console.log(c.client_email);' 2>/dev/null); then
            pass "Google Play key is a service account key for $play_email"
            if google-play tracks list --package-name "$APP_ID" >/dev/null 2>&1; then
              pass "Google Play key can access $APP_ID"
            else
              warn "Google Play access to $APP_ID not confirmed: normal before the first manual upload (guide 4, Part 3); otherwise invite $play_email (guide 4, Part 2B Step 4)"
            fi
          else
            fail "GCLOUD_SERVICE_ACCOUNT_CREDENTIALS is missing or not a service account key (guide 4, Part 2B Step 3)"
          fi

          if [ -n "${CM_KEYSTORE_PATH:-}" ] && keytool -list -keystore "$CM_KEYSTORE_PATH" \
              -storepass "$CM_KEYSTORE_PASSWORD" -alias "$CM_KEY_ALIAS" >/dev/null 2>&1; then
            pass "Android keystore upload_keystore opens with its password and alias"
          else
            fail "Android keystore upload_keystore is missing, or its password or alias is wrong (guide 4, Part 2B Step 5)"
          fi

          if [ "$failures" -gt 0 ]; then
            echo "$failures check(s) failed: the readiness check is No-go."
            exit 1
          fi
          echo "All checks passed."

  # Started manually in the customer's team. Refuses to run unless the
  # customer's service account belongs to the deployment's Firebase project.
  backend-deploy:
    name: Backend deploy
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      node: 22
      java: 21
      groups:
        - deployment
        - firebase_deploy
    scripts:
      - *fetch_deployment
      - name: Check deployment and deploy credential
        script: node tool/deployment.mjs check "$DEPLOYMENT_ID"
      - *release_check
      - *backend_install
      - *backend_build
      - *backend_test_functions
      - *backend_test_rules
      - name: Write Firebase deploy credentials
        script: |
          set -euo pipefail
          credentials_path="$HOME/firebase-deploy-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials_path"
          chmod 600 "$credentials_path"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials_path" >> "$CM_ENV"
      - name: Deploy Functions and rules
        script: node tool/deployment.mjs deploy-backend "$DEPLOYMENT_ID"
    publishing:
      <<: *email

  android-release:
    name: Android release
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      node: 22
      groups:
        - deployment
        - google_play
      android_signing:
        - upload_keystore
    scripts:
      - *fetch_deployment
      - *release_check
      - *use_deployment
      - *frontend_install
      - *frontend_analyze
      - *frontend_test
      - name: Build Android App Bundle
        script: |
          cd frontend
          flutter build appbundle \
            --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define-from-file=deployment.g.json \
            --dart-define=API_KEY="${API_KEY:-}"
    artifacts:
      - frontend/build/app/outputs/bundle/release/*.aab
      - frontend/build/app/outputs/mapping/release/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
      <<: *email

  ios-release:
    name: iOS release
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      node: 22
      groups:
        - deployment
        - ios_signing
    scripts:
      - *fetch_deployment
      - *release_check
      - *use_deployment
      - *frontend_install
      - *frontend_analyze
      - *frontend_test
      - name: Fetch iOS signing files for the deployment's app ID
        script: |
          set -euo pipefail
          keychain initialize
          app-store-connect fetch-signing-files "$APP_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          cd frontend && xcode-project use-profiles
      - name: Verify iOS entitlements in signing profile
        script: |
          set -euo pipefail
          required_domain="applinks:$AUTH_ACTION_HOST"
          # Xcode 16+ keeps profiles under UserData; older Xcode used MobileDevice.
          profiles_dirs=(
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
            "$HOME/Library/MobileDevice/Provisioning Profiles"
          )
          matching_profile_found=false
          profile_with_required_entitlements_found=false
          push_entitlement_found=false
          associated_domain_found=false
          for profile in "${profiles_dirs[0]}"/*.mobileprovision "${profiles_dirs[1]}"/*.mobileprovision; do
            [ -f "$profile" ] || continue
            echo "Checking profile: $(basename "$profile")"
            decoded_profile="$(mktemp)"
            if ! security cms -D -i "$profile" > "$decoded_profile" 2>/dev/null; then
              rm -f "$decoded_profile"
              continue
            fi
            app_identifier=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$decoded_profile" 2>/dev/null || true)
            aps_environment=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:aps-environment" "$decoded_profile" 2>/dev/null || true)
            associated_domains=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.associated-domains" "$decoded_profile" 2>/dev/null || true)
            case "$app_identifier" in
              *".$APP_ID") ;;
              *)
                rm -f "$decoded_profile"
                continue
                ;;
            esac
            matching_profile_found=true
            profile_has_push_entitlement=false
            profile_has_associated_domain=false
            case "$aps_environment" in
              development|production)
                push_entitlement_found=true
                profile_has_push_entitlement=true
                ;;
            esac
            normalized_associated_domains=$(printf '%s\n' "$associated_domains" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            if printf '%s\n' "$normalized_associated_domains" | grep -Fxq "$required_domain" ||
               printf '%s\n' "$normalized_associated_domains" | grep -Fxq "*"; then
              associated_domain_found=true
              profile_has_associated_domain=true
            fi
            rm -f "$decoded_profile"
            if [ "$profile_has_push_entitlement" = "true" ] && [ "$profile_has_associated_domain" = "true" ]; then
              profile_with_required_entitlements_found=true
              break
            fi
          done
          if [ "$matching_profile_found" != "true" ]; then
            echo "No provisioning profile for $APP_ID was found in:"
            printf '  %s\n' "${profiles_dirs[@]}"
            echo "Check the 'Fetch iOS signing files' step and that the App ID is registered."
            exit 1
          fi
          if [ "$push_entitlement_found" != "true" ]; then
            echo "The $APP_ID provisioning profile is missing the aps-environment entitlement."
            echo "Enable Push Notifications for the App ID, then rerun to regenerate the profile."
            exit 1
          fi
          if [ "$associated_domain_found" != "true" ]; then
            echo "The $APP_ID provisioning profile is missing $required_domain."
            echo "Enable Associated Domains for the App ID, then rerun to regenerate the profile."
            exit 1
          fi
          if [ "$profile_with_required_entitlements_found" != "true" ]; then
            echo "No single $APP_ID provisioning profile includes both required entitlements."
            exit 1
          fi
      - name: Build iOS IPA
        script: |
          cd frontend
          flutter build ipa \
            --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define-from-file=deployment.g.json \
            --dart-define=API_KEY="${API_KEY:-}"
    artifacts:
      - frontend/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
      <<: *email
