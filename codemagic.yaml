definitions:
  scripts:
    - &backend_install
      name: Install backend dependencies
      script: cd backend/functions && npm ci
    - &backend_build
      name: Build Cloud Functions
      script: cd backend/functions && npm run build
    - &backend_test_rules
      name: Test Firestore and Storage rules
      script: cd backend/functions && npm run test:rules

workflows:
  backend-ci:
    name: Backend CI
    instance_type: linux_x2
    max_build_duration: 20
    environment:
      node: 22
      java: 21
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - 'backend/'
    scripts:
      - *backend_install
      - *backend_build
      - *backend_test_rules

  backend-deploy:
    name: Backend deploy
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      node: 22
      java: 21
      groups:
        - firebase_deploy
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    when:
      changeset:
        includes:
          - 'backend/'
    scripts:
      - *backend_install
      - *backend_build
      - *backend_test_rules
      - name: Write Firebase deploy credentials
        script: |
          set -euo pipefail
          credentials_path="$HOME/firebase-deploy-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials_path"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials_path" >> "$CM_ENV"
      - name: Deploy Functions and rules
        script: |
          cd backend/functions
          npx firebase deploy \
            --config ../firebase.json \
            --only functions,firestore:rules,storage \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
    publishing:
      email:
        recipients:
          - $CM_PUBLISH_EMAIL
        notify:
          success: true
          failure: true

  android-release:
    name: Android release
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      groups:
        - app_secrets
      android_signing:
        - medsalem
    scripts:
      - name: Install dependencies
        script: cd frontend && flutter pub get
      - name: Analyze Dart code
        script: cd frontend && flutter analyze
      - name: Run tests
        script: cd frontend && flutter test
      - name: Build Android App Bundle
        script: |
          cd frontend
          flutter build appbundle \
            --release \
            --build-name=1.0.0 \
            --build-number="$BUILD_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=API_KEY="$API_KEY"
    artifacts:
      - frontend/build/app/outputs/bundle/release/*.aab
      - frontend/build/app/outputs/mapping/release/mapping.txt
    publishing:
      email:
        recipients:
          - $CM_PUBLISH_EMAIL
        notify:
          success: true
          failure: true

  ios-release:
    name: iOS release
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: codemagic
    environment:
      flutter: stable
      groups:
        - app_secrets
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yourname.skeleton
    scripts:
      - name: Install dependencies
        script: cd frontend && flutter pub get
      - name: Analyze Dart code
        script: cd frontend && flutter analyze
      - name: Run tests
        script: cd frontend && flutter test
      - name: Apply iOS signing profiles
        script: cd frontend && xcode-project use-profiles
      - name: Verify iOS entitlements in signing profile
        script: |
          set -euo pipefail
          profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          matching_profile_found=false
          profile_with_required_entitlements_found=false
          push_entitlement_found=false
          associated_domain_found=false
          for profile in "$profiles_dir"/*.mobileprovision; do
            [ -f "$profile" ] || continue
            decoded_profile="$(mktemp)"
            if ! security cms -D -i "$profile" > "$decoded_profile" 2>/dev/null; then
              rm -f "$decoded_profile"
              continue
            fi
            app_identifier=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$decoded_profile" 2>/dev/null || true)
            aps_environment=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:aps-environment" "$decoded_profile" 2>/dev/null || true)
            associated_domains=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.associated-domains" "$decoded_profile" 2>/dev/null || true)
            case "$app_identifier" in
              *".com.yourname.skeleton") ;;
              *)
                rm -f "$decoded_profile"
                continue
                ;;
            esac
            matching_profile_found=true
            profile_has_push_entitlement=false
            profile_has_associated_domain=false
            case "$aps_environment" in
              development|production)
                push_entitlement_found=true
                profile_has_push_entitlement=true
                ;;
            esac
            normalized_associated_domains=$(printf '%s\n' "$associated_domains" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            if printf '%s\n' "$normalized_associated_domains" | grep -Fxq "applinks:whatsapp-bot-f57a8.firebaseapp.com" ||
               printf '%s\n' "$normalized_associated_domains" | grep -Fxq "*"; then
              associated_domain_found=true
              profile_has_associated_domain=true
            fi
            rm -f "$decoded_profile"
            if [ "$profile_has_push_entitlement" = "true" ] && [ "$profile_has_associated_domain" = "true" ]; then
              profile_with_required_entitlements_found=true
              break
            fi
          done
          if [ "$matching_profile_found" != "true" ]; then
            echo "No provisioning profile for com.yourname.skeleton was found."
            echo "Select or generate a matching App Store provisioning profile in Codemagic."
            exit 1
          fi
          if [ "$push_entitlement_found" != "true" ]; then
            echo "The com.yourname.skeleton provisioning profile is missing the aps-environment entitlement."
            echo "Enable Push Notifications for the App ID and regenerate/select its provisioning profile in Codemagic."
            exit 1
          fi
          if [ "$associated_domain_found" != "true" ]; then
            echo "The com.yourname.skeleton provisioning profile is missing applinks:whatsapp-bot-f57a8.firebaseapp.com."
            echo "Enable Associated Domains for the App ID and regenerate/select its provisioning profile in Codemagic."
            exit 1
          fi
          if [ "$profile_with_required_entitlements_found" != "true" ]; then
            echo "No single com.yourname.skeleton provisioning profile includes both required entitlements."
            echo "Select a profile that includes Push Notifications and Associated Domains in Codemagic."
            exit 1
          fi
      - name: Build iOS IPA
        script: |
          cd frontend
          flutter build ipa \
            --release \
            --build-name=1.0.0 \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=API_KEY="$API_KEY"
    artifacts:
      - frontend/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - $CM_PUBLISH_EMAIL
        notify:
          success: true
          failure: true
